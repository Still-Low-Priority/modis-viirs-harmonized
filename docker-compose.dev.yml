# Standalone dev stack: docker compose -f docker-compose.dev.yml up --build
name: modis-viirs-dev

x-backend-dev: &backend-dev
  build:
    context: ./backend
    dockerfile: Dockerfile.dev
  volumes:
    - ./backend:/app
  env_file:
    - path: backend/.env
      required: false
  # Real env vars take precedence over backend/.env in pydantic-settings, so
  # these always win. FIRMS_MAP_KEY is the only key that has to come from
  # backend/.env; it is needed when an ingestion job runs, not at startup.
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/firms
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1

x-depends-infra: &depends-infra
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firms
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redisdata_dev:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend-dev
    # Dockerfile.dev only starts uvicorn; apply migrations first, like prod.
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on: *depends-infra
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8000:8000"

  # FIRMS ingestion worker. Waits for backend: only backend applies migrations.
  celery:
    <<: *backend-dev
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    depends_on: &depends-backend
      <<: *depends-infra
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Periodic task scheduler, one instance only. The schedule file goes to /tmp
  # so it does not land in the bind-mounted ./backend.
  celery-beat:
    <<: *backend-dev
    command: celery -A app.celery_app:celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on: *depends-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps the container's Linux node_modules from being
      # shadowed by (or mixed with) the host's node_modules.
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata_dev:
  redisdata_dev:
